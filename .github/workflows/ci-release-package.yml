name: Release package
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (one of): patch, minor, major'
        required: true
permissions:
  contents: write
jobs:

  actionlint:
    runs-on: ubuntu-26.04
    name: 'Actionlint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-actions

  yml-lint:
    runs-on: ubuntu-26.04
    name: 'YML lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-yml

  markdown-lint:
    runs-on: ubuntu-26.04
    name: 'Markdown lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-markdown

  caddyfile-fmt-check:
    runs-on: ubuntu-26.04
    name: 'Caddyfile format check'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check-caddyfile-fmt

  changelog-verify:
    runs-on: ubuntu-26.04
    name: 'Changelog verify'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Read Unreleased changelog section
        id: get-changelog
        uses: superfaceai/release-changelog-action@v3
        with:
          path-to-changelog: CHANGELOG.md
          version: Unreleased
          operation: read
      - name: Fail if Unreleased section is empty
        run: |
          if [ -z "$(echo '${{ steps.get-changelog.outputs.changelog }}' | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no entries under 'Unreleased' - add a changelog entry before releasing."
            exit 1
          fi


  checkout-repo-and-bump-version:
    runs-on: ubuntu-26.04
    name: Check out Repo and Bump Version
    timeout-minutes: 10
    needs:
      - actionlint
      - yml-lint
      - markdown-lint
      - caddyfile-fmt-check
      - changelog-verify
    steps:

      - uses: actions/checkout@v5

      - name: Bump version
        shell: bash
        run: |
          sudo apt-get install -y moreutils
          docker pull usvc/semver:latest
          version=$(cat composer.json | jq -r .version)
          bumpType=${{ github.event.inputs.release-type }}
          newVersion="$(docker run usvc/semver:latest bump $bumpType $version | tr -d '\r')"
          newVersionWithoutPatch=$(echo "$newVersion" | cut -d'.' -f1,2)
          newVersionWithoutMinor=$(echo "$newVersion" | cut -d'.' -f1)
          jq --arg newVersion "$newVersion" '.version = $newVersion' composer.json | sponge composer.json
          echo "New version: $newVersion"
          mkdir -p /tmp/ci-env
          echo "NEW_VERSION=$newVersion" >> /tmp/ci-env/NEW_VERSION.txt
          echo "NEW_VERSION_WITHOUT_PATCH=$newVersionWithoutPatch" >> /tmp/ci-env/NEW_VERSION.txt
          echo "NEW_VERSION_WITHOUT_MINOR=$newVersionWithoutMinor" >> /tmp/ci-env/NEW_VERSION.txt
          echo "NEW_VERSION=$newVersion" >> $GITHUB_ENV
          cat /tmp/ci-env/NEW_VERSION.txt
          echo "Update version in command examples within documentation"
          find ./docs/api-endpoints -type f -exec sed -i "s/$version/$newVersion/g" {} \;
          find ./docs/commands/assets -type f -exec sed -i "s/$version/$newVersion/g" {} \;

      - name: Update changelog unreleased section with new version
        uses: superfaceai/release-changelog-action@v3
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: release

      - name: Archive working folder for artifact
        shell: bash
        run: |
          tar --exclude='.git' -czf /tmp/bumped-repo.tar.gz .
          cd /tmp/ci-env/
          tar -czf /tmp/ci-env.tar.gz .

      - uses: actions/upload-artifact@v6
        with:
          name: bumped-repo
          path: /tmp/bumped-repo.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v6
        with:
          name: ci-env
          path: /tmp/ci-env.tar.gz
          retention-days: 7


  build-docker-image-dev-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: Build Docker Image - Dev - AMD
    timeout-minutes: 20
    needs: checkout-repo-and-bump-version
    steps:
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/build-docker-image
        with:
          target: development
          arch: amd
          cache-from: 'false'
          cache-to: 'false'
          artifact-name: docker-image-api-dev-amd
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-docker-image-dev-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: Build Docker Image - Dev - ARM
    timeout-minutes: 20
    needs: checkout-repo-and-bump-version
    steps:
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/build-docker-image
        with:
          target: development
          arch: arm
          cache-from: 'false'
          cache-to: 'false'
          artifact-name: docker-image-api-dev-arm
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-docker-image-prod-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: Build Docker Image - Prod - AMD
    timeout-minutes: 20
    needs: checkout-repo-and-bump-version
    steps:
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/build-docker-image
        with:
          target: production
          arch: amd
          version: ${{ env.NEW_VERSION }}
          cache-from: 'false'
          cache-to: 'false'
          artifact-name: docker-image-api-prod-amd
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-docker-image-prod-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: Build Docker Image - Prod - ARM
    timeout-minutes: 20
    needs: checkout-repo-and-bump-version
    steps:
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/build-docker-image
        with:
          target: production
          arch: arm
          version: ${{ env.NEW_VERSION }}
          cache-from: 'false'
          cache-to: 'false'
          artifact-name: docker-image-api-prod-arm
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}


  e2e-test-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: End To End Test - AMD
    timeout-minutes: 15
    needs:
      - build-docker-image-dev-amd
      - build-docker-image-prod-amd
    steps:
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: End To End Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api-prod\" && echo \$API_DOMAIN && composer test:end-to-end"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          artifact-name: docker-logs-release-e2e-amd

  e2e-test-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: End To End Test - ARM
    timeout-minutes: 15
    needs:
      - build-docker-image-dev-arm
      - build-docker-image-prod-arm
    steps:
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-arm
          tar-filename: dev-arm.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-arm
          tar-filename: prod-arm.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: End To End Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api-prod\" && echo \$API_DOMAIN && composer test:end-to-end"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          artifact-name: docker-logs-release-e2e-arm


  publish-release:
    runs-on: ubuntu-26.04
    name: Publish release
    timeout-minutes: 10
    needs:
      - e2e-test-amd
      - e2e-test-arm
    steps:

      - uses: actions/checkout@v5

      - uses: ./.github/actions/download-release-artifacts

      - name: Debug version
        run: |
          echo "${{ env.NEW_VERSION }}"
          echo "${{ env.NEW_VERSION_WITHOUT_PATCH }}"
          echo "${{ env.NEW_VERSION_WITHOUT_MINOR }}"

      # see also https://github.com/Nautilus-Cyberneering/pygithub
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Git configuration
        run: |
          git config --global user.email "${{ steps.import-gpg.outputs.email }}"
          git config --global user.name "${{ steps.import-gpg.outputs.name }}"

      - name: Commit changes and create tag
        run: |
          git add .
          git commit -m "chore: release ${{ env.NEW_VERSION }}"
          git tag ${{ env.NEW_VERSION }}

      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz

      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-arm
          tar-filename: prod-arm.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Create multi arch Docker image
        shell: bash
        run: |
          mkdir -p /tmp/docker

          docker tag api:prod-amd embernexus/api:tmp-latest-amd
          docker tag api:prod-arm embernexus/api:tmp-latest-arm
          docker tag api:prod-amd embernexus/api:${{ env.NEW_VERSION }}-amd
          docker tag api:prod-arm embernexus/api:${{ env.NEW_VERSION }}-arm
          docker save embernexus/api:${{ env.NEW_VERSION }}-amd | gzip > /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-amd.tar.gz
          docker save embernexus/api:${{ env.NEW_VERSION }}-arm | gzip > /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-arm.tar.gz
          docker push embernexus/api:tmp-latest-amd
          docker push embernexus/api:tmp-latest-arm

          # docker buildx imagetools create both creates and pushes the multi-arch manifest in one step, and -
          # unlike `docker manifest create --amend` - correctly composes inputs that are themselves image indexes
          # (e.g. carrying provenance/SBOM attestation manifests), so it has no "is a manifest list" failure mode.
          echo "Creating and pushing multi arch image embernexus/api:latest"
          docker buildx imagetools create \
            -t embernexus/api:latest \
            embernexus/api:tmp-latest-amd \
            embernexus/api:tmp-latest-arm

          echo "Creating and pushing multi arch image embernexus/api:${{ env.NEW_VERSION }}"
          docker buildx imagetools create \
            -t embernexus/api:${{ env.NEW_VERSION }} \
            embernexus/api:tmp-latest-amd \
            embernexus/api:tmp-latest-arm

          echo "Creating and pushing multi arch image embernexus/api:${{ env.NEW_VERSION_WITHOUT_PATCH }}"
          docker buildx imagetools create \
            -t embernexus/api:${{ env.NEW_VERSION_WITHOUT_PATCH }} \
            embernexus/api:tmp-latest-amd \
            embernexus/api:tmp-latest-arm

          echo "Creating and pushing multi arch image embernexus/api:${{ env.NEW_VERSION_WITHOUT_MINOR }}"
          docker buildx imagetools create \
            -t embernexus/api:${{ env.NEW_VERSION_WITHOUT_MINOR }} \
            embernexus/api:tmp-latest-amd \
            embernexus/api:tmp-latest-arm

          echo "Creating temporary JWT key for Docker Hub"
          export TMP_DOCKERHUB_JWT_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "'${{ secrets.DOCKERHUB_USERNAME}}'", "password": "'${{ secrets.DOCKERHUB_TOKEN }}'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          echo "Deleting Docker Hub tag embernexus/api:tmp-latest-amd"
          curl -s -X DELETE -H "Authorization: JWT ${TMP_DOCKERHUB_JWT_TOKEN}" https://hub.docker.com/v2/repositories/embernexus/api/tags/tmp-latest-amd
          echo "Deleting Docker Hub tag embernexus/api:tmp-latest-arm"
          curl -s -X DELETE -H "Authorization: JWT ${TMP_DOCKERHUB_JWT_TOKEN}" https://hub.docker.com/v2/repositories/embernexus/api/tags/tmp-latest-arm
          echo "Unsetting temporary Docker Hub JWT key"
          unset TMP_DOCKERHUB_JWT_TOKEN
          echo "Finished"

      - name: Push repository changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin && git push --tags

      - name: Read version changelog
        id: get-changelog
        uses: superfaceai/release-changelog-action@v3
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: read

      - name: Update GitHub release changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          body: ${{ steps.get-changelog.outputs.changelog }}
          prerelease: ${{ startsWith(github.event.inputs.release-type, 'pre') }}
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-amd.tar.gz
            /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-arm.tar.gz
