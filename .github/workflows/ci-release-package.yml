name: Release package
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (one of): patch, minor, major'
        required: true
permissions:
  contents: write
  packages: write
jobs:

  actionlint:
    runs-on: ubuntu-26.04
    name: 'Actionlint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-actions

  yml-lint:
    runs-on: ubuntu-26.04
    name: 'YML lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-yml

  markdown-lint:
    runs-on: ubuntu-26.04
    name: 'Markdown lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-markdown

  caddyfile-fmt-check:
    runs-on: ubuntu-26.04
    name: 'Caddyfile format check'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check-caddyfile-fmt

  changelog-verify:
    runs-on: ubuntu-26.04
    name: 'Changelog verify'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Compute next version
        id: next-version
        shell: bash
        run: |
          docker pull usvc/semver:latest
          version=$(cat composer.json | jq -r .version)
          bumpType=${{ github.event.inputs.release-type }}
          newVersion="$(docker run usvc/semver:latest bump $bumpType $version | tr -d '\r')"
          echo "version=$newVersion" >> "$GITHUB_OUTPUT"

      # Dry-run the same changelog operation that checkout-repo-and-bump-version will perform for real later.
      # This checkout is throwaway (nothing from this job is uploaded/persisted), so its only purpose is to catch
      # upfront anything the action's parser would choke on (e.g. malformed CHANGELOG.md) against the actual next
      # version, instead of finding out after the version bump/build/e2e steps have already run.
      - name: Dry-run release the changelog (result discarded)
        uses: superfaceai/release-changelog-action@v3
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ steps.next-version.outputs.version }}
          operation: release


  checkout-repo-and-bump-version:
    runs-on: ubuntu-26.04
    name: Check out Repo and Bump Version
    timeout-minutes: 10
    needs:
      - actionlint
      - yml-lint
      - markdown-lint
      - caddyfile-fmt-check
      - changelog-verify
    steps:

      - uses: actions/checkout@v5

      - name: Bump version
        shell: bash
        run: |
          sudo apt-get install -y moreutils
          docker pull usvc/semver:latest
          version=$(cat composer.json | jq -r .version)
          bumpType=${{ github.event.inputs.release-type }}
          newVersion="$(docker run usvc/semver:latest bump $bumpType $version | tr -d '\r')"
          newVersionWithoutPatch=$(echo "$newVersion" | cut -d'.' -f1,2)
          newVersionWithoutMinor=$(echo "$newVersion" | cut -d'.' -f1)
          jq --arg newVersion "$newVersion" '.version = $newVersion' composer.json | sponge composer.json
          echo "New version: $newVersion"
          mkdir -p /tmp/ci-env
          echo "NEW_VERSION=$newVersion" >> /tmp/ci-env/NEW_VERSION.txt
          echo "NEW_VERSION_WITHOUT_PATCH=$newVersionWithoutPatch" >> /tmp/ci-env/NEW_VERSION.txt
          echo "NEW_VERSION_WITHOUT_MINOR=$newVersionWithoutMinor" >> /tmp/ci-env/NEW_VERSION.txt
          echo "NEW_VERSION=$newVersion" >> $GITHUB_ENV
          cat /tmp/ci-env/NEW_VERSION.txt
          echo "Update version in command examples within documentation"
          find ./tests/Recordings/api-endpoints -type f -exec sed -i "s/$version/$newVersion/g" {} \;
          find ./tests/Recordings/commands/assets -type f -exec sed -i "s/$version/$newVersion/g" {} \;

          echo "Regenerate docs/src/data/swagger.json so it reflects the bumped recordings"
          node docs/scripts/generate-swagger.mjs

      - name: Update changelog unreleased section with new version
        uses: superfaceai/release-changelog-action@v3
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: release

      - name: Archive working folder for artifact
        shell: bash
        run: |
          tar --exclude='.git' -czf /tmp/bumped-repo.tar.gz .
          cd /tmp/ci-env/
          tar -czf /tmp/ci-env.tar.gz .

      - uses: actions/upload-artifact@v6
        with:
          name: bumped-repo
          path: /tmp/bumped-repo.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v6
        with:
          name: ci-env
          path: /tmp/ci-env.tar.gz
          retention-days: 7


  build-docker-image-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: Build Docker Image - AMD
    # GitHub Actions has no way to exempt a composite action's post/cleanup steps (e.g. setup-buildx-action's
    # builder teardown) from the job's timeout - it's one wall-clock budget for the whole job. The few extra
    # minutes here are headroom for that cleanup, not slack for the builds themselves.
    timeout-minutes: 35
    needs: checkout-repo-and-bump-version
    outputs:
      digest: ${{ steps.production.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/download-release-artifacts
      # Set up once and shared by both calls below: creating a second Buildx builder in between (e.g. by
      # letting the build-docker-image-release action set one up per call) would hand the development build a
      # fresh, cache-less builder instead of production's just-built layers - see gh-517.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Production is built first, pristine (--no-cache, no GHA cache), so the released image is always built
      # from scratch. Development is built right after in the same job/builder and reuses production's just-built
      # layers (shared ancestor stages such as php_base/frankenphp_builder/php) via the local Buildx builder cache.
      - id: production
        uses: ./.github/actions/build-docker-image-release
        with:
          target: production
          arch: amd
          version: ${{ env.NEW_VERSION }}
          artifact-name: docker-image-api-prod-amd
          push: 'true'
          dockerhub-repository: embernexus/api
      - uses: ./.github/actions/build-docker-image-release
        with:
          target: development
          arch: amd
          artifact-name: docker-image-api-dev-amd

  build-docker-image-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: Build Docker Image - ARM
    timeout-minutes: 35
    needs: checkout-repo-and-bump-version
    outputs:
      digest: ${{ steps.production.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/download-release-artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: production
        uses: ./.github/actions/build-docker-image-release
        with:
          target: production
          arch: arm
          version: ${{ env.NEW_VERSION }}
          artifact-name: docker-image-api-prod-arm
          push: 'true'
          dockerhub-repository: embernexus/api
      - uses: ./.github/actions/build-docker-image-release
        with:
          target: development
          arch: arm
          artifact-name: docker-image-api-dev-arm


  build-docs-dist:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build docs dist'
    timeout-minutes: 15
    needs: checkout-repo-and-bump-version
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/build-docker-image-docs
        with:
          target: development
          arch: amd
          artifact-name: docker-image-docs-release-dev-amd
          artifact-retention-days: 1
      - uses: ./.github/actions/run-docs-pnpm-command
        with:
          artifact-name: docker-image-docs-release-dev-amd
          command: build
          version: ${{ env.NEW_VERSION }}
      - name: Archive dist
        run: tar -czf docs-dist.tar.gz -C docs dist
      - uses: actions/upload-artifact@v6
        with:
          name: docs-dist-release
          path: docs-dist.tar.gz
          retention-days: 7

  build-docs-image-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build docs Docker Image - AMD'
    timeout-minutes: 15
    needs: build-docs-dist
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-push-docs-image
        with:
          arch: amd
          dist-artifact-name: docs-dist-release
          ghcr-image-name: ember-nexus/api-docs
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          save-tarball: 'true'
          tarball-artifact-name: docker-image-docs-release-amd
          tarball-filename: docs-release-amd.tar.gz

  build-docs-image-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: 'Build docs Docker Image - ARM'
    timeout-minutes: 15
    needs: build-docs-dist
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-push-docs-image
        with:
          arch: arm
          dist-artifact-name: docs-dist-release
          ghcr-image-name: ember-nexus/api-docs
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          save-tarball: 'true'
          tarball-artifact-name: docker-image-docs-release-arm
          tarball-filename: docs-release-arm.tar.gz

  push-docs-multiarch-ghcr:
    runs-on: ubuntu-26.04
    name: 'Push docs multi arch image to GHCR'
    timeout-minutes: 15
    needs:
      - checkout-repo-and-bump-version
      - build-docs-image-amd
      - build-docs-image-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/combine-multiarch-image
        with:
          image-ref: ghcr.io/ember-nexus/api-docs
          amd-digest: ${{ needs.build-docs-image-amd.outputs.digest }}
          arm-digest: ${{ needs.build-docs-image-arm.outputs.digest }}
          tags: ${{ env.NEW_VERSION }}
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  e2e-test-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: End To End Test - AMD
    timeout-minutes: 15
    needs:
      - build-docker-image-amd
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: End To End Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api-prod\" && echo \$API_DOMAIN && composer test:end-to-end"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          artifact-name: docker-logs-release-e2e-amd

  e2e-test-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: End To End Test - ARM
    timeout-minutes: 15
    needs:
      - build-docker-image-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/download-release-artifacts
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-arm
          tar-filename: dev-arm.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-arm
          tar-filename: prod-arm.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: End To End Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api-prod\" && echo \$API_DOMAIN && composer test:end-to-end"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-neo4j-latest-versitygw.yml
          artifact-name: docker-logs-release-e2e-arm


  publish-release:
    runs-on: ubuntu-26.04
    name: Publish release
    timeout-minutes: 10
    needs:
      - build-docker-image-amd
      - build-docker-image-arm
      - e2e-test-amd
      - e2e-test-arm
      - push-docs-multiarch-ghcr
    steps:

      - uses: actions/checkout@v5

      - uses: ./.github/actions/download-release-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: docker-image-docs-release-amd
          path: /tmp/docker

      - uses: actions/download-artifact@v8
        with:
          name: docker-image-docs-release-arm
          path: /tmp/docker

      - name: Rename docs images for release attachment
        run: |
          mv /tmp/docker/docs-release-amd.tar.gz "/tmp/docker/docker-image-ember-nexus-api-docs-${{ env.NEW_VERSION }}-amd.tar.gz"
          mv /tmp/docker/docs-release-arm.tar.gz "/tmp/docker/docker-image-ember-nexus-api-docs-${{ env.NEW_VERSION }}-arm.tar.gz"

      - name: Copy OpenAPI/Swagger spec for release attachment
        run: cp docs/src/data/swagger.json "/tmp/docker/openapi-ember-nexus-api-${{ env.NEW_VERSION }}.json"

      - name: Debug version
        run: |
          echo "${{ env.NEW_VERSION }}"
          echo "${{ env.NEW_VERSION_WITHOUT_PATCH }}"
          echo "${{ env.NEW_VERSION_WITHOUT_MINOR }}"

      # see also https://github.com/Nautilus-Cyberneering/pygithub
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Git configuration
        run: |
          git config --global user.email "${{ steps.import-gpg.outputs.email }}"
          git config --global user.name "${{ steps.import-gpg.outputs.name }}"

      - name: Commit changes and create tag
        run: |
          git add .
          git commit -m "chore: release ${{ env.NEW_VERSION }}"
          git tag ${{ env.NEW_VERSION }}

      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
          rename-to: api:prod-amd

      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-arm
          tar-filename: prod-arm.tar.gz
          rename-to: api:prod-arm

      - name: Save per-arch release tarballs
        run: |
          mkdir -p /tmp/docker

          docker tag api:prod-amd embernexus/api:${{ env.NEW_VERSION }}-amd
          docker tag api:prod-arm embernexus/api:${{ env.NEW_VERSION }}-arm
          docker save embernexus/api:${{ env.NEW_VERSION }}-amd | gzip > /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-amd.tar.gz
          docker save embernexus/api:${{ env.NEW_VERSION }}-arm | gzip > /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-arm.tar.gz

      # Each arch's image was already pushed, digest-only (no tag), straight from its build job.
      - uses: ./.github/actions/combine-multiarch-image
        with:
          image-ref: embernexus/api
          amd-digest: ${{ needs.build-docker-image-amd.outputs.digest }}
          arm-digest: ${{ needs.build-docker-image-arm.outputs.digest }}
          tags: latest,${{ env.NEW_VERSION }},${{ env.NEW_VERSION_WITHOUT_PATCH }},${{ env.NEW_VERSION_WITHOUT_MINOR }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push repository changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin && git push --tags

      - name: Read version changelog
        id: get-changelog
        uses: superfaceai/release-changelog-action@v3
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: read

      - name: Update GitHub release changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          body: ${{ steps.get-changelog.outputs.changelog }}
          prerelease: ${{ startsWith(github.event.inputs.release-type, 'pre') }}
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-amd.tar.gz
            /tmp/docker/docker-image-ember-nexus-api-${{ env.NEW_VERSION }}-arm.tar.gz
            /tmp/docker/docker-image-ember-nexus-api-docs-${{ env.NEW_VERSION }}-amd.tar.gz
            /tmp/docker/docker-image-ember-nexus-api-docs-${{ env.NEW_VERSION }}-arm.tar.gz
            /tmp/docker/openapi-ember-nexus-api-${{ env.NEW_VERSION }}.json
