name: "CI Docker Image build"
on:
  schedule:
    - cron: "10 2 * * 2"
jobs:
  build-docker-image-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build Docker Image - AMD'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(cat composer.json | jq -r .version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-docker-image
        with:
          target: development
          arch: amd
          cache-from: 'false'
          artifact-name: docker-image-api-dev-amd
          artifact-retention-days: 21
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-docker-image
        with:
          target: production
          arch: amd
          version: ${{ steps.version.outputs.version }}
          cache-from: 'false'
          artifact-name: docker-image-api-prod-amd
          artifact-retention-days: 21
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-docker-image-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: 'Build Docker Image - ARM'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(cat composer.json | jq -r .version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-docker-image
        with:
          target: development
          arch: arm
          cache-from: 'false'
          artifact-name: docker-image-api-dev-arm
          artifact-retention-days: 21
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-docker-image
        with:
          target: production
          arch: arm
          version: ${{ steps.version.outputs.version }}
          cache-from: 'false'
          artifact-name: docker-image-api-prod-arm
          artifact-retention-days: 21
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
