name: 'CI Docs'

# Temporary: until this branch is merged, run on both main and this branch directly so the pipeline
# gets exercised before merge. Narrow back down to `main` only once gh-495 is merged.
on:
  push:
    branches:
      - main
      - feature/gh-495-integrate-next-doc

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  compute-version:
    runs-on: ubuntu-26.04
    name: 'Compute version tag'
    timeout-minutes: 3
    outputs:
      version-tag: ${{ steps.version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version-tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build-dist:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build dist'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-docker-image-docs
        with:
          target: development
          arch: amd
          artifact-name: docker-image-docs-ci-dev-amd
          artifact-retention-days: 1
      - uses: ./.github/actions/run-docs-pnpm-command
        with:
          artifact-name: docker-image-docs-ci-dev-amd
          command: build
      - name: Archive dist
        run: tar -czf docs-dist.tar.gz -C docs dist
      - uses: actions/upload-artifact@v6
        with:
          name: docs-dist
          path: docs-dist.tar.gz
          retention-days: 7

  build-image-amd:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build Docker Image - AMD'
    timeout-minutes: 15
    needs:
      - build-dist
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-push-docs-image
        with:
          arch: amd
          dist-artifact-name: docs-dist
          ghcr-image-name: ember-nexus/api-docs
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  build-image-arm:
    runs-on: gh-4vcpu-ubuntu-latest-arm
    name: 'Build Docker Image - ARM'
    timeout-minutes: 15
    needs:
      - build-dist
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-push-docs-image
        with:
          arch: arm
          dist-artifact-name: docs-dist
          ghcr-image-name: ember-nexus/api-docs
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  push-multiarch-ghcr:
    runs-on: ubuntu-26.04
    name: 'Push multi arch image to GHCR'
    timeout-minutes: 15
    needs:
      - compute-version
      - build-image-amd
      - build-image-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version-tag: ${{ needs.compute-version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v5

      - id: push
        uses: ./.github/actions/combine-multiarch-image
        with:
          image-ref: ghcr.io/ember-nexus/api-docs
          amd-digest: ${{ needs.build-image-amd.outputs.digest }}
          arm-digest: ${{ needs.build-image-arm.outputs.digest }}
          tags: ${{ needs.compute-version.outputs.version-tag }}
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  docs-deploy:
    runs-on: ubuntu-26.04
    name: 'Docs deploy'
    timeout-minutes: 5
    needs:
      - push-multiarch-ghcr
    # Disabled until a deploy target domain/webhook secret has been set up: flip the
    # `DOCS_DEPLOY_ENABLED` repo/environment variable to 'true' once that's ready. Narrowing to
    # `main` (instead of also this branch) is left for when this is enabled for real.
    if: vars.DOCS_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://api.docs.ember-nexus.dev/
    steps:
      - name: Request deploy webhook OIDC token
        id: oidc
        run: |
          set -eu
          JWT=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ vars.DOCS_DEPLOY_WEBHOOK_AUDIENCE }}" \
            | jq -r .value)
          echo "::add-mask::$JWT"
          echo "jwt=$JWT" >> "$GITHUB_OUTPUT"

      - name: Call deploy webhook
        run: |
          set -eu
          curl -fsS -X POST "${{ vars.DOCS_DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.jwt }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${GITHUB_SHA}\",\"image\":\"ghcr.io/ember-nexus/api-docs@${{ needs.push-multiarch-ghcr.outputs.digest }}\"}"
