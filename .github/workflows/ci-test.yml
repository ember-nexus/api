name: Test

on:
  - push

jobs:

  actionlint:
    runs-on: ubuntu-26.04
    name: 'Actionlint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-actions

  yml-lint:
    runs-on: ubuntu-26.04
    name: 'YML lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-yml

  markdown-lint:
    runs-on: ubuntu-26.04
    name: 'Markdown lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-markdown

  caddyfile-fmt-check:
    runs-on: ubuntu-26.04
    name: 'Caddyfile format check'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check-caddyfile-fmt

  docs-swagger-up-to-date:
    runs-on: ubuntu-26.04
    name: 'Docs: swagger.json up to date'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate swagger.json from its fragments and recordings, compare against the committed version
        run: |
          beforeHash="$(sha256sum docs/src/data/swagger.json | awk '{print $1}')"
          node docs/scripts/generate-swagger.mjs
          afterHash="$(sha256sum docs/src/data/swagger.json | awk '{print $1}')"
          if [ "$beforeHash" != "$afterHash" ]; then
            echo "::error::docs/src/data/swagger.json is out of date with its fragments under docs/src/data/swagger/ and/or tests/recordings/. Run 'task docs:swagger:generate' and commit the result."
            git --no-pager diff -- docs/src/data/swagger.json
            exit 1
          fi
          echo "docs/src/data/swagger.json is up to date (sha256 $beforeHash)."

  build-docker-image:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build Docker Image'
    timeout-minutes: 60
    needs:
      - actionlint
      - yml-lint
      - markdown-lint
      - caddyfile-fmt-check
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(cat composer.json | jq -r .version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-docker-image
        with:
          target: development
          arch: amd
          artifact-name: docker-image-api-dev-amd
          artifact-retention-days: 7
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-docker-image
        with:
          target: production
          arch: amd
          version: ${{ steps.version.outputs.version }}
          artifact-name: docker-image-api-prod-amd
          artifact-retention-days: 7
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  docs-build-docker-image:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Docs: Build Docker Image'
    timeout-minutes: 20
    needs:
      - actionlint
      - yml-lint
      - markdown-lint
      - caddyfile-fmt-check
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-docker-image-docs
        with:
          target: development
          arch: amd
          artifact-name: docker-image-docs-dev-amd
          artifact-retention-days: 7

  docs-cs-lint:
    runs-on: ubuntu-26.04
    name: 'Docs: CS Lint'
    timeout-minutes: 5
    needs:
      - docs-build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/run-docs-pnpm-command
        with:
          artifact-name: docker-image-docs-dev-amd
          command: cs

  docs-spellcheck:
    runs-on: ubuntu-26.04
    name: 'Docs: Spellcheck'
    timeout-minutes: 5
    needs:
      - docs-build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/run-docs-pnpm-command
        with:
          artifact-name: docker-image-docs-dev-amd
          command: spellcheck

  docs-quality:
    runs-on: ubuntu-26.04
    name: 'Docs: Quality'
    timeout-minutes: 5
    needs:
      - docs-build-docker-image
    # Known pre-existing failures (content collections not resolving / dist not built first in
    # this job) - not blocking CI on these for now, see gh-495.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/run-docs-pnpm-command
        with:
          artifact-name: docker-image-docs-dev-amd
          command: test

  docs-e2e:
    runs-on: ubuntu-26.04
    name: 'Docs: End To End Test'
    timeout-minutes: 15
    needs:
      - docs-build-docker-image
    # Known pre-existing failure - not blocking CI on this for now, see gh-495.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image-docs
        with:
          artifact-name: docker-image-docs-dev-amd
          tar-filename: docs-dev-amd.tar.gz
      - name: Build and start preview server
        run: |
          docker run -d --name docs-preview --network host \
            -v $(pwd)/docs:/docs -w /docs \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ASTRO_TELEMETRY_DISABLED=1 \
            docs:dev sh -c "pnpm install && pnpm run build && pnpm run preview -- --host 0.0.0.0 --port 4322"
      - name: Wait for preview server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4322 > /dev/null && exit 0
            sleep 1
          done
          echo "preview server did not start in time" >&2
          docker logs docs-preview >&2
          exit 1
      - name: Playwright e2e
        run: |
          docker run --rm --network host \
            -v $(pwd)/docs:/docs -w /docs \
            -e BASE_URL=http://localhost:4322 \
            mcr.microsoft.com/playwright:v1.62.1-noble npx playwright test
      - name: Docs container logs
        if: always()
        run: docker logs docs-preview || true
      - name: Clean up preview server
        if: always()
        run: docker rm -f docs-preview || true

  cs-lint:
    runs-on: ubuntu-26.04
    name: 'CS Lint'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: CS Lint
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev sh -c "composer install --ignore-platform-req=php --quiet && PHP_CS_FIXER_IGNORE_ENV=1 composer cs:list"

  psalm:
    runs-on: ubuntu-26.04
    name: 'Psalm'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Psalm
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev sh -c "composer install --ignore-platform-req=php --quiet && composer psalm -- --no-progress"

  phpstan:
    runs-on: ubuntu-26.04
    name: 'Phpstan'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Phpstan
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev sh -c "composer install --ignore-platform-req=php --quiet && composer phpstan -- --no-progress"

  test-unit:
    runs-on: ubuntu-26.04
    name: 'Unit Test'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Unit Test
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev sh -c "composer install --ignore-platform-req=php --quiet && composer test:unit"

  test-mutant:
    runs-on: ubuntu-26.04
    name: 'Mutant Test'
    timeout-minutes: 15
    needs:
      - build-docker-image
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Mutant Test
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev sh -c "composer install --ignore-platform-req=php --quiet && ./bin/with-heartbeat composer test:mutant -- --no-progress"

  test-mess-detector:
    runs-on: ubuntu-26.04
    name: 'Mess Detector'
    timeout-minutes: 5
    needs:
      - build-docker-image
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Mess Detector
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev sh -c "composer install --ignore-platform-req=php --quiet && composer mess"

  test-end-to-end:
    runs-on: ubuntu-26.04
    name: 'End To End Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    strategy:
      matrix:
        dockerCompose:
          - "neo4j-5.7-minio"
          - "neo4j-5.20-seaweedfs"
          - "neo4j-latest-versitygw"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-${{ matrix.dockerCompose }}.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: End To End Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api-prod\" && echo \$API_DOMAIN && composer test:end-to-end"
      - name: Run cron jobs once manually
        # Smoke test only (business logic is unit/end-to-end-tested elsewhere): proves the cron jobs run end-to-end
        # against the prod image with a tty, since DISABLE_CRON=true on the containers would otherwise make a
        # tty-less exec a no-op.
        run: |
          docker exec -t --user "$(id -u):$(id -g)" api-prod php bin/console cron:delete-expired-uploads
          docker exec -t --user "$(id -u):$(id -g)" api-prod php bin/console cron:reindex-files
          docker exec -t --user "$(id -u):$(id -g)" api-prod php bin/console cron:update-ownership
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-${{ matrix.dockerCompose }}.yml
          artifact-name: docker-logs-end-to-end-${{ matrix.dockerCompose }}

  test-example-generation-controller:
    runs-on: ubuntu-26.04
    name: 'Controller Example Generation Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/ExampleGenerationController/docker-compose.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: Controller Example Generation Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api\" && echo \$API_DOMAIN && composer test:example-generation-controller && composer test:example-generation-controller:with-different-configuration-1 && composer test:example-generation-controller:with-different-configuration-2"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/ExampleGenerationController/docker-compose.yml
          artifact-name: docker-logs-example-generation-controller


  test-example-generation-command:
    runs-on: ubuntu-26.04
    name: 'Command Example Generation Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/ExampleGenerationCommand/docker-compose.yml
          exec-container: api
          prepare-script: ./bin/test-end-to-end-command-prepare
      - name: Command Example Generation Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api bash -c "BACKUP_FOLDER_CAN_BE_RESET=1 composer test:example-generation-command"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/ExampleGenerationCommand/docker-compose.yml
          artifact-name: docker-logs-example-generation-command

  test-server:
    runs-on: ubuntu-26.04
    name: 'Server Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # the scenarios run one after another and restart the production container with lower limits
      - name: Server Test
        run: |
          chmod +x ./bin/test-server
          KEEP_STACK=1 ./bin/test-server
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/ServerTests/docker-compose.yml
          compose-project: enx-server-tests
          artifact-name: docker-logs-server
