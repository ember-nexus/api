name: Test

on:
  - push

jobs:

  actionlint:
    runs-on: ubuntu-26.04
    name: 'Actionlint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-actions

  yml-lint:
    runs-on: ubuntu-26.04
    name: 'YML lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-yml

  markdown-lint:
    runs-on: ubuntu-26.04
    name: 'Markdown lint'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lint-markdown

  caddyfile-fmt-check:
    runs-on: ubuntu-26.04
    name: 'Caddyfile format check'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check-caddyfile-fmt

  build-docker-image:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build Docker Image'
    timeout-minutes: 40
    needs:
      - actionlint
      - yml-lint
      - markdown-lint
      - caddyfile-fmt-check
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(cat composer.json | jq -r .version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-docker-image
        with:
          target: development
          arch: amd
          artifact-name: docker-image-api-dev-amd
          artifact-retention-days: 7
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-docker-image
        with:
          target: production
          arch: amd
          version: ${{ steps.version.outputs.version }}
          artifact-name: docker-image-api-prod-amd
          artifact-retention-days: 7
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  cs-lint:
    runs-on: ubuntu-26.04
    name: 'CS Lint'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: CS Lint
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev-amd sh -c "composer install --ignore-platform-req=php --quiet && PHP_CS_FIXER_IGNORE_ENV=1 composer cs:list"

  psalm:
    runs-on: ubuntu-26.04
    name: 'Psalm'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Psalm
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev-amd sh -c "composer install --ignore-platform-req=php --quiet && composer psalm -- --no-progress"

  phpstan:
    runs-on: ubuntu-26.04
    name: 'Phpstan'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Phpstan
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev-amd sh -c "composer install --ignore-platform-req=php --quiet && composer phpstan -- --no-progress"

  test-unit:
    runs-on: ubuntu-26.04
    name: 'Unit Test'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Unit Test
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev-amd sh -c "composer install --ignore-platform-req=php --quiet && composer test:unit"

  test-mutant:
    runs-on: ubuntu-26.04
    name: 'Mutant Test'
    timeout-minutes: 10
    needs:
      - build-docker-image
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Mutant Test
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev-amd sh -c "composer install --ignore-platform-req=php --quiet && ./bin/with-heartbeat composer test:mutant -- --no-progress"

  test-mess-detector:
    runs-on: ubuntu-26.04
    name: 'Mess Detector'
    timeout-minutes: 5
    needs:
      - build-docker-image
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Mess Detector
        run: |
          docker run -v $(pwd):/var/www/html --user "$(id -u):$(id -g)" api:dev-amd sh -c "composer install --ignore-platform-req=php --quiet && composer mess"

  test-end-to-end:
    runs-on: ubuntu-26.04
    name: 'End To End Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    strategy:
      matrix:
        dockerCompose:
          - "neo4j-5.7-minio"
          - "neo4j-5.20-seaweedfs"
          - "neo4j-latest-versitygw"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-${{ matrix.dockerCompose }}.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: End To End Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api-prod\" && echo \$API_DOMAIN && composer test:end-to-end"
      - name: Run cron jobs once manually
        # Smoke test only (business logic is unit/end-to-end-tested elsewhere): proves the cron jobs run end-to-end
        # against the prod image with a tty, since DISABLE_CRON=true on the containers would otherwise make a
        # tty-less exec a no-op.
        run: |
          docker exec -t --user "$(id -u):$(id -g)" api-prod php bin/console cron:delete-expired-uploads
          docker exec -t --user "$(id -u):$(id -g)" api-prod php bin/console cron:reindex-files
          docker exec -t --user "$(id -u):$(id -g)" api-prod php bin/console cron:update-ownership
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/EndToEndTests/docker-compose-${{ matrix.dockerCompose }}.yml
          artifact-name: docker-logs-end-to-end-${{ matrix.dockerCompose }}

  test-example-generation-controller:
    runs-on: ubuntu-26.04
    name: 'Controller Example Generation Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/ExampleGenerationController/docker-compose.yml
          exec-container: api-dev
          prepare-script: ./bin/test-end-to-end-prepare
      - name: Controller Example Generation Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api-dev bash -c "export API_DOMAIN=\"http://api\" && echo \$API_DOMAIN && composer test:example-generation-controller && composer test:example-generation-controller:with-different-configuration"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/ExampleGenerationController/docker-compose.yml
          artifact-name: docker-logs-example-generation-controller


  test-example-generation-command:
    runs-on: ubuntu-26.04
    name: 'Command Example Generation Test'
    timeout-minutes: 15
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/compose-stack-up
        with:
          compose-file: ./tests/ExampleGenerationCommand/docker-compose.yml
          exec-container: api
          prepare-script: ./bin/test-end-to-end-command-prepare
      - name: Command Example Generation Test
        run: |
          docker exec --user "$(id -u):$(id -g)" api bash -c "BACKUP_FOLDER_CAN_BE_RESET=1 composer test:example-generation-command"
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/ExampleGenerationCommand/docker-compose.yml
          artifact-name: docker-logs-example-generation-command

  test-server:
    runs-on: ubuntu-26.04
    name: 'Server Test'
    timeout-minutes: 20
    needs:
      - test-unit
      - phpstan
      - psalm
      - cs-lint
      - test-mess-detector
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-dev-amd
          tar-filename: dev-amd.tar.gz
      - uses: ./.github/actions/load-docker-image
        with:
          artifact-name: docker-image-api-prod-amd
          tar-filename: prod-amd.tar.gz
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # the scenarios run one after another and restart the production container with lower limits
      - name: Server Test
        run: |
          chmod +x ./bin/test-server
          KEEP_STACK=1 ./bin/test-server
      - uses: ./.github/actions/collect-docker-logs
        if: always()
        with:
          compose-file: ./tests/ServerTests/docker-compose.yml
          compose-project: enx-server-tests
          artifact-name: docker-logs-server
