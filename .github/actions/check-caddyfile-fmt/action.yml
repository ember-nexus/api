name: 'Caddyfile format check'
description: 'Checks docker/api/Caddyfile and docker/api/Caddyfile.dev are formatted with `caddy fmt`.'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: docker pull caddy:2.11.6-alpine
    - shell: bash
      run: docker run --rm -v "$(pwd)/docker/api":/data -w /data caddy:2.11.6-alpine caddy fmt --diff Caddyfile
    - shell: bash
      run: docker run --rm -v "$(pwd)/docker/api":/data -w /data caddy:2.11.6-alpine caddy fmt --diff Caddyfile.dev
