name: 'Build Docker image (release, isolated)'
description: >
  Builds the API Docker image for a given target/arch via Buildx, saves it to a tar.gz and uploads it as an
  artifact. Dedicated to the release pipeline: never touches the GitHub Actions Buildx cache, so a release build
  can't be affected by a stale/cross-run cache. The production target always builds with --no-cache (pristine,
  reproducible). The development target is expected to run right after production, in the same job, and
  deliberately does not pass --no-cache, so it reuses production's just-built layers (shared ancestor stages such
  as php_base/frankenphp_builder/php) from the local Buildx builder cache. Always disables provenance/SBOM
  attestations, since those cause Buildx to emit an OCI image index (manifest list) even for a single-arch --load
  build, which later breaks `docker manifest create --amend`.

  When `push` is true, the same build also pushes straight to Docker Hub under no tag at all (a bare,
  content-addressable push - digest only, no tag ever created), via a second `--output`. That digest is what the
  caller later feeds into `docker buildx imagetools create` to assemble the multi-arch manifest, so there's never
  a throwaway tag to clean up afterwards.

  Does NOT set up Buildx or log in to Docker Hub itself: the caller must do that once, before its first call to
  this action in a job, and reuse it across both the production and development calls. Setting up Buildx inside
  this action would spin up a brand-new, cache-less builder on every call - since this action's two calls (--output
  type=image needs the docker-container driver) would each get their own isolated builder, defeating the very
  layer reuse described above.
inputs:
  target:
    description: 'Dockerfile build target (development or production)'
    required: true
  arch:
    description: 'Architecture suffix used for image tags/artifact names (amd or arm)'
    required: true
  version:
    description: 'Value passed as the VERSION build-arg (production target only)'
    required: false
    default: ''
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: true
  artifact-retention-days:
    description: 'Retention in days for the uploaded artifact'
    required: false
    default: '7'
  push:
    description: 'Also push the built image to dockerhub-repository under no tag (digest-only)'
    required: false
    default: 'false'
  dockerhub-repository:
    description: 'Docker Hub repository to push to when push is true (e.g. embernexus/api)'
    required: false
    default: ''
outputs:
  digest:
    description: 'Digest of the pushed image (only set when push is true)'
    value: ${{ steps.build.outputs.digest }}
runs:
  using: 'composite'
  steps:
    - name: Build and save Docker image - ${{ inputs.target }} ${{ inputs.arch }}
      id: build
      shell: bash
      run: |
        set -eu
        TAG="api:${{ inputs.target == 'development' && 'dev' || 'prod' }}"
        TARBALL="${{ inputs.target == 'development' && 'dev' || 'prod' }}-${{ inputs.arch }}.tar.gz"
        RAW_TAR="/tmp/$(basename "$TARBALL" .tar.gz).tar"

        CACHE_ARGS=()
        if [ "${{ inputs.target }}" = "production" ]; then
          CACHE_ARGS+=(--no-cache)
        fi

        BUILD_ARG_ARGS=()
        if [ -n "${{ inputs.version }}" ]; then
          BUILD_ARG_ARGS+=(--build-arg "VERSION=${{ inputs.version }}")
        fi

        OUTPUT_ARGS=(--output "type=docker,dest=$RAW_TAR,name=$TAG")
        if [ "${{ inputs.push }}" = "true" ]; then
          OUTPUT_ARGS+=(--output "type=image,name=${{ inputs.dockerhub-repository }},push=true")
        fi

        docker buildx build \
          --target "${{ inputs.target }}" \
          --provenance=false \
          --sbom=false \
          "${CACHE_ARGS[@]}" \
          "${BUILD_ARG_ARGS[@]}" \
          "${OUTPUT_ARGS[@]}" \
          --metadata-file /tmp/metadata.json \
          -f ./docker/api/Dockerfile \
          .

        gzip -c "$RAW_TAR" > "$TARBALL"
        echo "TARBALL_PATH=$TARBALL" >> "$GITHUB_ENV"

        if [ "${{ inputs.push }}" = "true" ]; then
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ env.TARBALL_PATH }}
        retention-days: ${{ inputs.artifact-retention-days }}
