name: 'Run a pnpm command against the docs site, in Docker'
description: >
  Loads a previously built docs dev Docker image artifact and runs `pnpm install` plus a pnpm
  script inside it, entirely in Docker (matching how the rest of this repo's checks run). Always
  pins HOME to a writable directory and disables Astro's telemetry - without that, running as
  `--user "$(id -u):$(id -g)"` only gets a working $HOME when the runner's host uid happens to
  match the image's baked-in `astro` user (uid 1000); on a CI runner where it doesn't, $HOME falls
  back to `/`, which isn't writable, and e.g. Astro's telemetry fails outright trying to create
  `/.config/astro` (EACCES).
inputs:
  artifact-name:
    description: 'Name of the docs dev Docker image artifact (produced by build-docker-image-docs)'
    required: true
  tar-filename:
    description: 'Filename of the tar.gz inside that artifact'
    required: false
    default: 'docs-dev-amd.tar.gz'
  command:
    description: 'pnpm script to run after `pnpm install` (e.g. build, cs, test, spellcheck)'
    required: true
runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/load-docker-image-docs
      with:
        artifact-name: ${{ inputs.artifact-name }}
        tar-filename: ${{ inputs.tar-filename }}

    - name: pnpm ${{ inputs.command }}
      shell: bash
      run: |
        docker run -v "$(pwd)/docs":/docs -v "$(pwd)/tests/recordings":/tests/recordings:ro -w /docs \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e ASTRO_TELEMETRY_DISABLED=1 \
          docs:dev sh -c "pnpm install && pnpm run ${{ inputs.command }}"
