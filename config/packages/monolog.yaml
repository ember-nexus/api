monolog:
  channels:
    - deprecation  # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
  monolog:
    handlers:
      main:
        type: stream
        path: "%kernel.logs_dir%/dev.log"
        level: debug
        channels: ["!event", "!request"]
        formatter: monolog_json_formatter
      # only active for commands which run in a terminal, regular requests never use it
      console:
        type: service
        id: App\Logger\TerminalConsoleHandler
        channels: ["!event", "!doctrine", "!console"]

when@test:
  monolog:
    handlers:
      main:
        type: fingers_crossed
        action_level: error
        handler: nested
        excluded_http_codes: [404, 405]
        channels: ["!event"]
      nested:
        type: stream
        path: "%kernel.logs_dir%/test.log"
        level: debug

when@prod:
  monolog:
    handlers:
      # declared first: for commands which run in a terminal it handles the records and stops them from also reaching
      # the JSON handlers below; without a terminal (cron, CI) or for regular requests it is inactive
      console:
        type: service
        id: App\Logger\TerminalConsoleHandler
        channels: ["!event", "!doctrine", "!deprecation"]
      main:
        type: fingers_crossed
        action_level: error
        handler: nested
        excluded_http_codes: [404, 405]
        buffer_size: 50  # How many messages should be saved? Prevent memory leaks
      nested:
        type: stream
        path: "php://stderr"
        level: debug
        formatter: monolog.formatter.json
      deprecation:
        type: stream
        path: "php://stderr"
        level: error
        # without the channel restriction every error would be written a second time in the line format
        channels: ["deprecation"]
