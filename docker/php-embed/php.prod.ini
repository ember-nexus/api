expose_php = Off
memory_limit = 256M
error_log = /dev/stderr
display_errors = Off
; failures which happen before the application handles them (e.g. exhausted memory while booting) are only visible here
log_errors = On
html_errors = Off
zend.assertions = -1

; upload limited to 101 MiB
upload_max_filesize = 105906176
post_max_size = 105906176
max_file_uploads = 1

; a single request may take at most 15 minutes, see also `read_body` in the Caddyfile; on Linux this only counts time
; in which PHP itself is working, not time spent waiting for the client or S3
max_execution_time = 900

; production: the image is immutable, so files are never checked for changes; the preload file is generated by the
; Symfony cache warmup during the image build
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.preload = /var/www/html/config/preload.php
opcache.preload_user = worker
realpath_cache_size = 4096K
realpath_cache_ttl = 600
