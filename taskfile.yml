version: '3'

tasks:

  caddy:fmt:
    cmds:
      - docker run --rm -v $(pwd)/docker:/data -w /data caddy:2.11.6-alpine caddy fmt --overwrite Caddyfile
      - docker run --rm -v $(pwd)/docker:/data -w /data caddy:2.11.6-alpine caddy fmt --overwrite Caddyfile.dev

  dev:build:
    cmds:
      - docker compose -f ./tools/docker-compose.yml build

  dev:up:
    cmds:
      - docker compose -f ./tools/docker-compose.yml up -d  --remove-orphans

  dev:down:
    cmds:
      - docker compose -f ./tools/docker-compose.yml down

  dev:cli:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec api /bin/bash

  dev:k6:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec k6 pnpm demo

  dev:k6:load:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec k6 pnpm load

  prod:build:
    vars:
      VERSION:
        sh: echo "local-$(date +%Y%m%d)"
      TAG:
        sh: echo "embernexus/api:local-$(date +%Y%m%d)"
      OUTPUT_FILE:
        sh: echo "ember-nexus-api-local-$(date +%Y%m%d).tar.gz"
      COMPOSE_OUTPUT_FILE:
        sh: echo "docker-compose.yml"
    cmds:
      - docker build -f ./docker/Dockerfile --target production --build-arg VERSION={{.VERSION}} -t {{.TAG}} .
      - docker save {{.TAG}} > ~/Downloads/{{.OUTPUT_FILE}}
      - chown $(id -u):$(id -g) ~/Downloads/{{.OUTPUT_FILE}}
      - sed "s|__EMBER_NEXUS_API_IMAGE__|{{.TAG}}|" ./tools/docker-compose.demo.tmpl.yml > ~/Downloads/{{.COMPOSE_OUTPUT_FILE}}
      - chown $(id -u):$(id -g) ~/Downloads/{{.COMPOSE_OUTPUT_FILE}}
      - echo "demo security.txt" > ~/Downloads/well-known-security.txt
      - chown $(id -u):$(id -g) ~/Downloads/well-known-security.txt
      - |
        echo ""
        echo "Getting started:"
        echo "docker load < {{.OUTPUT_FILE}}"
        echo "echo \"demo security.txt\" > well-known-security.txt"
        echo "mkdir -p ./volumes/neo4j/data"
        echo "mkdir -p ./volumes/neo4j/logs"
        echo "mkdir -p ./volumes/mongodb"
        echo "mkdir -p ./volumes/elasticsearch"
        echo "mkdir -p ./volumes/redis"
        echo "mkdir -p ./volumes/rabbitmq"
        echo "mkdir -p ./volumes/minio"
        echo "mkdir -p ./volumes/api"
        echo "chmod 777 -R ./volumes"
        echo "docker compose up -d"

  docs:dev:build:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml build

  docs:dev:up:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml up -d --remove-orphans

  docs:dev:down:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml down

  docs:dev:cli:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml exec --user astro core /bin/bash

  docs:check:all:
    desc: Run every docs check (build, tests, lint, spellcheck, e2e) in the order the build depends on.
    cmds:
      - task: docs:check:build
      - task: docs:check:test
      - task: docs:check:lint
      - task: docs:check:spellcheck
      - task: docs:check:e2e

  docs:check:build:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run build"

  docs:check:test:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run test"

  docs:check:lint:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run cs"

  docs:check:spellcheck:
    cmds:
      - docker compose -f ./docs-tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run spellcheck"

  docs:check:e2e:
    desc: Run Playwright e2e tests (Chromium, in the separate `e2e` container) against a preview server of docs/dist.
    cmds:
      - sh ./docs-tools/run-e2e.sh

  docs:prod:build:
    cmds:
      - docker build -f docs-tools/Dockerfile --target production -t ember-nexus-api-docs:latest .

  docs:prod:run:
    cmds:
      - docker run -p 80:80 ember-nexus-api-docs:latest

  docs:swagger:generate:
    cmds:
      - find ./docs/src/data/swagger -name '*.json' -print0 | sort -z | xargs -0 jq -s 'reduce .[1:][] as $x (.[0]; . * $x)' > ./docs/src/data/swagger.json
