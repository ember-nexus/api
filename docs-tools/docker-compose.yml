name: doc

services:

  docs:
    container_name: docs
    build:
      dockerfile: docs-tools/Dockerfile
      context: ..
      target: development
    tty: true
    volumes:
      - ../docs:/docs
      # Mounted one level above /docs so relative paths from docs/scripts/ (../../tests/recordings)
      # resolve the same way here as they do from a plain repo checkout on the host.
      - ../tests/recordings:/tests/recordings:ro
    environment:
      VERSION: '0.1.31'
    working_dir: /docs
    ports:
      - 4321:4321

  # Chromium for Playwright, kept out of the `docs` image entirely — pin this
  # tag to the exact `@playwright/test` version in docs/package.json (the npm
  # package and the browsers baked into this image must match).
  e2e:
    container_name: e2e
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    tty: true
    volumes:
      - ../docs:/docs
    working_dir: /docs
    environment:
      BASE_URL: http://docs:4322
    depends_on:
      - docs
